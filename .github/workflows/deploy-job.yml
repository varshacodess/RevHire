name: job-service CI

on:
  pull_request:
    branches:
      - development
    paths:
      - job-service/**
      - .github/workflows/deploy-job.yml
  push:
    branches:
      - development
    paths:
      - job-service/**
      - .github/workflows/deploy-job.yml

jobs:
  build-and-test:
    name: Build and test job-service
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test with Maven
        working-directory: job-service
        run: mvn -B -ntp clean verify
