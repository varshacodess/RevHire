name: discovery-server CI

on:
  pull_request:
    branches:
      - development
    paths:
      - discovery-server/**
      - .github/workflows/deploy-discovery.yml
  push:
    branches:
      - development
    paths:
      - discovery-server/**
      - .github/workflows/deploy-discovery.yml

jobs:
  build-and-test:
    name: Build and test discovery-server
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test with Maven
        working-directory: discovery-server
        run: mvn -B -ntp clean verify
